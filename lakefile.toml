name = "NystromSubmodularity"
defaultTargets = ["NystromSubmodularity"]

# Pinned to a stable mathlib release so that `lake exe cache get` reliably
# fetches prebuilt artifacts instead of rebuilding mathlib from source.
# The value of `lean-toolchain` must stay in sync with this revision.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "NystromSubmodularity"
