[project]
name = "graphnystrom"
version = "0.1.0"
description = "Nyström landmark selection using the Lean-certified nuclear residual"
readme = "APPLICATION.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["graphnystrom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
